# Action for running tests
# This file has been automatically created.
# To recreate it you can run this command
# ./console generate:test-action --php-versions="7.2,8.2"

name: Matomo Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '**.x-dev'
      - 'next_release'
  workflow_dispatch:
  workflow_call:
    inputs:
      is_preview:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTS_PASS:
        required: false
      TESTOMATIO_INTEGRATION:
        required: false
  schedule:
    # Run every 2 hours from Saturday 00:00 (Germany) until Sunday 16:00 (Germany)
    # Germany assumed CET (UTC+1):
    # - Start: Sat 00:00 DE  -> Fri 23:00 UTC
    # - End:   Sun 16:00 DE -> Sun 15:00 UTC
    #
    # Friday 23:00 UTC (Sat 00:00 DE)
    - cron: "0 23 * * 5"
    # All odd hours on Saturday UTC: 01,03,...,23
    - cron: "0 1-23/2 * * 6"
    # Sunday UTC hours: 01,03,05,07,09,11,13,15 (up to 16:00 DE)
    - cron: "0 1-15/2 * * 0"
permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: php-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  PHP:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      matrix:
        type: [ 'IntegrationTestsPlugins' ]
        environment:
          - php: '8.5'
            adapter: 'MYSQLI'
            mysql-engine: 'Mysql'
            mysql-version: '8.0'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: enable mysql slow query log
        if: ${{ matrix.environment.mysql-engine == 'Mysql' || matrix.environment.mysql-engine == 'Mariadb' }}
        shell: bash
        run: |
          set +e
          mysql -h127.0.0.1 -uroot -e "SET GLOBAL log_output = 'TABLE';"
          mysql -h127.0.0.1 -uroot -e "SET GLOBAL slow_query_log = 'ON';"
          mysql -h127.0.0.1 -uroot -e "SET GLOBAL long_query_time = 0.5;"
          mysql -h127.0.0.1 -uroot -e "SHOW VARIABLES LIKE 'slow_query_log%';"
          mysql -h127.0.0.1 -uroot -e "SHOW VARIABLES LIKE 'long_query_time';"
          mysql -h127.0.0.1 -uroot -e "SHOW VARIABLES LIKE 'log_output';"
      - name: capture mysql status before tests
        if: ${{ matrix.environment.mysql-engine == 'Mysql' || matrix.environment.mysql-engine == 'Mariadb' }}
        shell: bash
        run: |
          set +e
          mkdir -p matomo/ci-diagnostics
          mysql -h127.0.0.1 -uroot -e "SHOW GLOBAL STATUS" > matomo/ci-diagnostics/mysql-status-before.txt
          mysql -h127.0.0.1 -uroot -e "SHOW ENGINE INNODB STATUS\\G" > matomo/ci-diagnostics/innodb-status-before.txt
          mysql -h127.0.0.1 -uroot -e "SHOW PROCESSLIST" > matomo/ci-diagnostics/processlist-before.txt
      - name: capture system stats before tests
        shell: bash
        run: |
          set +e
          mkdir -p matomo/ci-diagnostics
          echo "date: $(date -u +%FT%TZ)" > matomo/ci-diagnostics/system-before.txt
          echo "uname: $(uname -a)" >> matomo/ci-diagnostics/system-before.txt
          free -m >> matomo/ci-diagnostics/system-before.txt
          df -h >> matomo/ci-diagnostics/system-before.txt
          vmstat 1 5 >> matomo/ci-diagnostics/system-before.txt
          ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%cpu | head -n 25 >> matomo/ci-diagnostics/system-before.txt
      - name: running tests
        uses: matomo-org/github-action-tests@disable-jit
        with:
          test-type: ${{ matrix.type }}
          mysql-driver: ${{ matrix.environment.adapter }}
          mysql-engine: ${{ matrix.environment.mysql-engine }}
          mysql-version: ${{ matrix.environment.mysql-version }}
          php-version: ${{ matrix.environment.php }}
          redis-service: true
          phpunit-test-options: '--log-junit results.xml'
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: ${{ matrix.environment.php == '7.2' }}
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
      - name: upload junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-results-${{ matrix.environment.php }}-${{ matrix.environment.adapter }}-${{ matrix.environment.mysql-engine }}-${{ matrix.environment.mysql-version }}
          path: matomo/results.xml
      - name: capture mysql status after tests
        if: always() && (matrix.environment.mysql-engine == 'Mysql' || matrix.environment.mysql-engine == 'Mariadb')
        shell: bash
        run: |
          set +e
          mkdir -p matomo/ci-diagnostics
          mysql -h127.0.0.1 -uroot -e "SHOW GLOBAL STATUS" > matomo/ci-diagnostics/mysql-status-after.txt
          mysql -h127.0.0.1 -uroot -e "SHOW ENGINE INNODB STATUS\\G" > matomo/ci-diagnostics/innodb-status-after.txt
          mysql -h127.0.0.1 -uroot -e "SHOW PROCESSLIST" > matomo/ci-diagnostics/processlist-after.txt
          mysql -h127.0.0.1 -uroot -e "SELECT * FROM mysql.slow_log ORDER BY start_time DESC LIMIT 200\\G" > matomo/ci-diagnostics/mysql-slow-log.txt
      - name: capture system stats after tests
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p matomo/ci-diagnostics
          echo "date: $(date -u +%FT%TZ)" > matomo/ci-diagnostics/system-after.txt
          echo "uname: $(uname -a)" >> matomo/ci-diagnostics/system-after.txt
          free -m >> matomo/ci-diagnostics/system-after.txt
          df -h >> matomo/ci-diagnostics/system-after.txt
          vmstat 1 5 >> matomo/ci-diagnostics/system-after.txt
          ps -eo pid,ppid,cmd,%mem,%cpu --sort=-%cpu | head -n 25 >> matomo/ci-diagnostics/system-after.txt
      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ matrix.environment.php }}-${{ matrix.environment.adapter }}-${{ matrix.environment.mysql-engine }}-${{ matrix.environment.mysql-version }}
          path: matomo/ci-diagnostics
